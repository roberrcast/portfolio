<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Description -->
        <meta
            name="description"
            content="Front-End Developer crafting modern, scalable web applications with React, Vite, TypeScript, and Styled-Components. Dedicated to performant code and intuitive user experiences."
        />

        <!-- Keywords-->
        <meta
            name="keywords"
            content="Roberto Rodriguez, Rob Rodriguez, Front End Developer, Web Developer, React, TypeScript, JavaScript, HTML5, CSS, SASS, Vite, Styled Components, Responsive Design, Portfolio, Mexico"
        />

        <meta name="robots" content="index, follow" />

        <!-- Open Graph / facebook / linkedin -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://robrodriguez.dev" />
        <meta
            property="og:title"
            content="Rob Rodriguez - Front End Developer"
        />
        <meta
            property="og:description"
            content="Front End Developer building modern web experiences with React and TypeScript. Open to new opportunities."
        />

        <!-- JPG image for best compatibility -->
        <meta
            property="og:image"
            content="https://robrodriguez.dev/graph-image.jpg"
        />

        <!-- Twitter / X -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://robrodriguez.dev" />
        <meta
            property="twitter:title"
            content="Rob Rodriguez - Front End Developer"
        />
        <meta
            property="twitter:description"
            content="Front End Developer building modern web experiences with React and TypeScript. Open to new opportunities."
        />
        <meta
            property="twitter:image"
            content="https://robrodriguez.dev/graph-image.jpg"
        />

        <!-- favicons, fonts -->
        <title>Portfolio | Roberto Rodríguez</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0..200&display=swap"
            rel="stylesheet"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon-16x16.png"
        />
        <link rel="manifest" href="/site.webmanifest" />
    </head>
    <body>
        <div id="root"></div>
        <form
            name="contact"
            data-netlify="true"
            netlify-honeypot="bot-field"
            hidden
        >
            <input type="hidden" name="bot-field" />
            <input type="text" name="name" />
            <input type="email" name="email" />
            <input type="text" name="subject" />
            <textarea name="message"></textarea>
        </form>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
